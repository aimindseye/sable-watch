# SonarQube Cloud, CI-based analysis (.github/workflows/sonar.yml).
# Automatic Analysis must be turned off in the project's settings, or the scan is refused.
sonar.organization=aimindseye
sonar.projectKey=aimindseye_sable-watch
sonar.projectName=Sable Watch

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/src/test/**
sonar.exclusions=**/src/test/**,**/build/**,**/.gradle/**
sonar.sourceEncoding=UTF-8

# No compiled classes are given to the Java analyzer.
sonar.java.binaries=.sonar-empty
sonar.java.test.binaries=.sonar-empty

# No coverage reports are imported yet; without this every new line counts as uncovered.
sonar.coverage.exclusions=**/*
